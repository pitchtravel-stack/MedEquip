<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedEquip ร้องกวาง</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
window.__errs=[];
function __showErr(t){window.__errs.push(String(t));var e=document.getElementById('lerr');if(e){e.innerHTML='\u26a0\ufe0f '+window.__errs.slice(-4).map(function(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}).join('<br>');}}
window.onerror=function(m,s,l,c){var ctx='';try{if(window.__code&&!window.__appReady){var ln=window.__code.split('\n')[l-1]||'';ctx=' | code: '+ln.slice(Math.max(0,c-60),c+40);}}catch(x){}__showErr(m+' (line '+l+':'+c+')'+ctx);};
window.addEventListener('unhandledrejection',function(ev){__showErr((ev.reason&&ev.reason.message)||ev.reason);});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#64748b;--line:#e2e8f0;--pri:#8a6420;--pri2:#a87a32;--pril:#f6ecd6;--ok:#0f9d58;--okl:#e6f6ee;--warn:#b45309;--warnl:#fff4e0;--bad:#c62828;--badl:#fdecec;--gray:#94a3b8;--side:#6b4a1f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#5a3c15,#a87a32)}
.lbox{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lbox h1{margin:0 0 4px;font-size:22px}.lbox p{margin:0 0 18px;color:var(--mut);font-size:14px}
.pin{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pin span{width:46px;height:54px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.pin span.f{border-color:var(--pri);background:var(--pril)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:14px;border:1px solid var(--line);background:#f8fafc;border-radius:12px;font-size:20px;cursor:pointer}
.keypad button:active{background:var(--pril)}
.demo{margin-top:16px;font-size:12.5px;color:var(--mut);background:#f8fafc;border-radius:10px;padding:10px}
.demo b{color:var(--ink)}
/* shell */
#app{display:flex;min-height:100%}
#side{width:248px;background:linear-gradient(180deg,#7a5524,#5a3c15);color:#f3e6c8;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 10px}
.brand{color:#fff;font-weight:700;font-size:18px;padding:4px 10px 2px}.brand small{display:block;font-weight:400;font-size:12px;color:#e8cf9a}
.ngrp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#e0c07a;margin:16px 10px 6px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#fbf3e1;text-decoration:none;font-size:14.5px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07)}.nav a.on{background:#c9a24a;color:#2b1d08;font-weight:600}
.nav a .c{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top .burg{display:none;border:0;background:none;font-size:22px;cursor:pointer}
#gq{flex:1;min-width:0;max-width:520px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#f8fafc}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--pril);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700}
#view{padding:20px;max-width:1400px;width:100%}
h2.t{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.proto{background:#fff7e6;border:1px solid #fde1a8;color:#8a5a00;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
/* ui */
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:15.5px}
.kpi .l{color:var(--mut);font-size:13px}.kpi .v{font-size:26px;font-weight:700;line-height:1.2}.kpi .s{font-size:12.5px;color:var(--mut)}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.pri .v{color:var(--pri)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--pri2)}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--bad)}.btn.s{padding:5px 10px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select,.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;min-width:0}
.bar input[type=search]{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap;background:#fafcff;position:sticky;top:0}
td{border-bottom:1px solid #eef2f7;padding:8px;vertical-align:top}
tr.ck{cursor:pointer}tr.ck:hover td{background:#fbf6ea}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.b{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.b.ok{background:var(--okl);color:var(--ok)}.b.bad{background:var(--badl);color:var(--bad)}.b.warn{background:var(--warnl);color:var(--warn)}.b.pri{background:var(--pril);color:var(--pri)}.b.g{background:#eef2f7;color:#475569}
.mut{color:var(--mut)}.sm{font-size:12.5px}.r{text-align:right}.nw{white-space:nowrap}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs a{padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut);white-space:nowrap}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow:auto}
.col{background:#f5efe2;border-radius:12px;padding:10px;min-height:200px}
.col h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.tk{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;font-size:13.5px}
.tk:hover{border-color:var(--pri2)}.tk .n{font-weight:600}.tk.u{border-left:4px solid var(--bad)}
/* charts */
.hb{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .tr{background:#eef2f7;border-radius:6px;height:14px;overflow:hidden}.hb .fi{height:100%;background:var(--pri2);border-radius:6px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols .cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--mut)}
.cols .cb{width:100%;max-width:38px;background:var(--pri2);border-radius:6px 6px 0 0;position:relative}
.cols .cb span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink)}
.prog{height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
/* drawer/modal */
#ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:flex-end}
#dr{background:#fff;width:min(640px,100%);height:100%;overflow:auto;padding:20px;animation:sl .18s ease}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
#mo{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
#mb{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto}
.x{float:right;border:0;background:#f1f5f9;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:13.5px;color:var(--mut)}.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:12px;font-size:13.5px}.tl div:before{content:'';position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--pri2);border:2px solid #fff}
.tl div.r:before{background:var(--bad)}.tl div.g:before{background:var(--ok)}.tl div.o:before{background:var(--warn)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-size:14px}
.qrbox{display:inline-block;border:1px dashed var(--gray);border-radius:10px;padding:10px;text-align:center;font-size:12px}
.lbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#f1f5f9;border-radius:6px;padding:1px 6px}
pre{background:#0f172a;color:#dbeafe;border-radius:12px;padding:14px;overflow:auto;font-size:12.5px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
 #side{position:fixed;left:0;z-index:40;transform:translateX(-100%);transition:.2s;height:100%}
 #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
 #top .burg{display:block}#view{padding:14px}.g2,.g3{grid-template-columns:1fr}
 .who .nm{display:none}.dl{grid-template-columns:110px 1fr}.f .row{grid-template-columns:1fr}
 .hidem{display:none}
}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}}
</style>
<style>
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:95;display:flex;align-items:center;justify-content:center}
.spin{width:42px;height:42px;border:4px solid var(--pril);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#reader{width:100%;max-width:420px;margin:auto}
#printArea{display:none}
@media print{
 body *{visibility:hidden}#printArea,#printArea *{visibility:visible}
 #printArea{display:block;position:absolute;left:0;top:0;width:100%}
 .plbl{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
 .plbl>div{border:1px dashed #999;padding:3mm;text-align:center;font-size:9pt;break-inside:avoid;font-family:'IBM Plex Sans Thai',sans-serif}
 @page{size:A4;margin:10mm}
}
</style>
</head>
<body>
<div id="login">
 <div class="lbox">
  <h1>🩺 MedEquip ร้องกวาง</h1>
  <p>ระบบทะเบียนครุภัณฑ์การแพทย์ & ศูนย์เครื่องมือแพทย์</p>
  <label class="sm mut">Gmail ที่ลงทะเบียนกับผู้ดูแลระบบ</label>
  <input id="lemail" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px;font-size:16px">
  <div id="lotpw" class="hide" style="margin-top:12px">
   <div class="sm" style="background:var(--pril);border-radius:10px;padding:8px 10px">ส่งรหัส 6 หลักไปที่ <b id="lto"></b> แล้ว (ใช้ได้ 10 นาที)</div>
   <input id="lotp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:24px;letter-spacing:8px;text-align:center;font-weight:700">
   <div style="display:flex;justify-content:space-between;margin-top:6px"><a id="lback" class="sm" style="cursor:pointer">เปลี่ยนอีเมล</a><a id="lresend" class="sm" style="cursor:pointer">ส่งรหัสอีกครั้ง</a></div>
  </div>
  <button id="lbtn" class="btn p" style="width:100%;margin-top:14px;padding:11px">ขอรหัสเข้าใช้ทาง Gmail</button>
  <div id="lerr" class="sm" style="color:var(--bad);text-align:center;min-height:20px;margin-top:6px"></div>
  <div class="sm mut" style="text-align:center;margin-top:10px" id="lver">MedEquip</div>
 </div>
</div>
<div id="app" class="hide">
 <aside id="side"></aside>
 <div id="main">
  <div id="top"><button class="burg" onclick="$('#side').classList.toggle('open')">☰</button>
   <input id="gq" type="search" placeholder="🔍 ค้นหา รหัส / ชื่อ / ยี่ห้อ / หน่วยงาน…">
   <button class="btn s" onclick="scanQR()" title="สแกน QR">📷</button>
   <div class="who"><div class="nm sm" id="whonm"></div><div class="av" id="whoav" onclick="myMenu()" style="cursor:pointer"></div><button class="btn s" onclick="logout()">ออก</button></div></div>
  <div id="view"></div>
 </div>
</div>
<div id="ov" class="hide" onclick="if(event.target===this)closeDr()"><div id="dr"></div></div>
<div id="mo" class="hide" onclick="if(event.target===this)closeMo()"><div id="mb"></div></div>
<div id="busy" class="hide"><div class="spin"></div></div>
<div id="toast" class="hide"></div>
<div id="printArea"></div>
<script>
/* ===== GitHub Pages: paste the web app URL (ends with /exec) from Deploy > Manage deployments ===== */
var API_URL='https://script.google.com/macros/s/AKfycby3fy3T_BxBGYnr9VbUzmnl9--jqjhlBFsuRXil3Q8soLzAN8ASpWDtrWO6rcB59dgZ-g/exec';
var VIA_GAS=!!(window.google&&google.script&&google.script.run);
/* fetch JSON API -> Promise(data) */
function apiPost(fn,args){
  if(/PUT_DEPLOYMENT_ID/.test(API_URL))return Promise.reject(new Error('API_URL not set in Index.html'));
  return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})})
    .catch(function(){throw new Error('\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08 (network)');})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(t){var o;try{o=JSON.parse(t);}catch(e){throw new Error('Bad response: check API_URL / Deploy access = Anyone');}if(!o.ok)throw new Error(o.error||'error');return o.data;});
}
/* same chain style as google.script.run: GSR().withSuccessHandler(f).withFailureHandler(g).fnName(args...) */
function GSR(){
  if(VIA_GAS)return google.script.run;
  var ok=function(){},fail=function(){};
  var p=new Proxy({},{get:function(_,k){
    if(k==='withSuccessHandler')return function(f){ok=f;return p;};
    if(k==='withFailureHandler')return function(f){fail=f;return p;};
    return function(){var a=Array.prototype.slice.call(arguments);apiPost(String(k),a).then(function(d){ok(d);},function(e){fail(e);});};
  }});
  return p;
}
(function(){
  var e=document.getElementById('lerr');if(e)e.textContent='Loading...';
  GSR().withSuccessHandler(function(r){
    if(!r||!r.code){__showErr((r&&r.err)||'getClientJs returned nothing');return;}
    window.__code=r.code;
    var s=document.createElement('script');s.text=r.code;document.body.appendChild(s);
    if(!window.__appReady){__showErr('main script failed (see message above)');}
  }).withFailureHandler(function(err){__showErr('getClientJs: '+((err&&err.message)||err));}).getClientJs();
})();
</script>
</body>
</html>
